# Rootless and hardened container Podman configuration
# Enforces Kubernetes restricted Pod Security Standards and rootless execution
#
# References:
# - Kubernetes Pod Security Standards (restricted)
# - Podman containers.conf(5) documentation

[containers]
# Run containers with automatic user namespace allocation for non-root execution
# Allocates a unique subordinate UID/GID range per container so root is unprivileged on host
userns = "auto"

# Drop capabilities by default and permit only NET_BIND_SERVICE
default_capabilities = [
  "NET_BIND_SERVICE",
]

# Disallow privileged containers
privileged = false

# Runtime default seccomp profile
seccomp_profile = "/usr/share/containers/seccomp.json"

# Strict namespace isolation
cgroupns = "private"
ipcns = "private"
pidns = "private"
utsns = "private"

[machine]
# Default VM resource allocation for macOS podman machine
provider = "applehv"

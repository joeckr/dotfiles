# OpenShift SCC Strict (restricted-v2) compliant Podman configuration
#
# References:
# - OpenShift restricted-v2 Security Context Constraints (SCC)
# - Podman containers.conf(5) documentation

[containers]
# Run containers with automatic user namespace allocation (mimicking OpenShift's MustRunAsRange random UID allocation)
# Allocates a unique subordinate UID/GID range per container so root is unprivileged on host
userns = "auto"

# OpenShift restricted-v2 drops ALL capabilities by default and permits only NET_BIND_SERVICE
default_capabilities = [
  "NET_BIND_SERVICE",
]

# Disallow privileged containers (forbidden in OpenShift restricted/strict SCC)
privileged = false

# Runtime default seccomp profile
seccomp_profile = "/usr/share/containers/seccomp.json"

# Strict namespace isolation (forbidden host namespaces in OpenShift restricted SCC)
cgroupns = "private"
ipcns = "private"
pidns = "private"
utsns = "private"

[machine]
# Default VM resource allocation for macOS podman machine
provider = "applehv"
